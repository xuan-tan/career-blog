{{/* ─────────────────────────────────────────────────────────────
  Home — full-bleed hero: anchor column + card rail.
  Markup only. All styling is .ed-hero* in assets/css/type-system.css,
  behaviour is assets/js/hero-carousel.js. Do not add a <style> block
  here — see .design-system.md §10.
───────────────────────────────────────────────────────────── */}}

{{ $sections := slice }}
{{ $sectionRefs := slice "craft" "journal/travel" "journal" "photosets" }}
{{ $cardLabels := slice "Craft" "Travel" "Journal" "Photosets" }}
{{ $cardSubtitles := slice "Pursuit of Making" "Adventures" "Scribbles & Thoughts" "Seeing" }}

{{ range $i, $ref := $sectionRefs }}
  {{ with $.Site.GetPage $ref }}
    {{ $img := "" }}
    {{/* Featured image: section page first, then its first child that has one. */}}
    {{ range .Resources.ByType "image" }}
      {{ if findRE "featured?" .Name }}
        {{ $img = .RelPermalink }}
      {{ end }}
    {{ end }}
    {{ if not $img }}
      {{ range .Pages }}
        {{ range .Resources.ByType "image" }}
          {{ if findRE "featured?" .Name }}
            {{ $img = .RelPermalink }}
          {{ end }}
        {{ end }}
        {{ if $img }}{{ break }}{{ end }}
      {{ end }}
    {{ end }}
    {{ $sections = $sections | append (dict
      "url" .RelPermalink
      "label" (index $cardLabels $i)
      "subtitle" (index $cardSubtitles $i)
      "img" $img)
    }}
  {{ end }}
{{ end }}

<div class="ed-hero ed-bleed" id="hero-root" data-hero-carousel>

  <div class="ed-hero__bg">
    {{ with resources.Get "images/home-cover.jpg" }}
      <img class="ed-hero__bg--dark" src="{{ .RelPermalink }}" alt="" aria-hidden="true" loading="eager">
    {{ end }}
    {{ with resources.Get "images/home-cover-l.jpg" }}
      <img class="ed-hero__bg--light" src="{{ .RelPermalink }}" alt="" aria-hidden="true" loading="eager">
    {{ end }}
  </div>
  <div class="ed-hero__veil"></div>

  <div class="ed-hero__row">

    <div class="ed-hero__anchor">
      <div class="ed-hero__anchor-inner">
        <h1 class="ed-hero__title">{{ .Site.Params.Author.name | default "Xuan T." }}</h1>
        <p class="ed-hero__lede">Documenting on the lighter side of life.</p>
        {{ $bikesUrl := "/craft/bikes" }}
        {{ with $.Site.GetPage "/craft/bikes" }}{{ $bikesUrl = .RelPermalink }}{{ end }}
        <div class="ed-hero__cta">
          <a href="{{ $bikesUrl }}" class="ed-btn-ghost">Explore my bikes</a>
        </div>
      </div>
    </div>

    <div class="ed-hero__rail">
      <div class="ed-hero__rail-inner">
        <div class="ed-hero__vp">
          <div class="ed-hero__track">
            {{ range $sections }}
              <a href="{{ .url }}" class="ed-hero-card">
                <div class="ed-hero-card__bg"{{ if .img }} style="background-image:url('{{ .img }}')"{{ end }}>
                  {{ if not .img }}<span class="ed-hero-card__glyph" aria-hidden="true">📁</span>{{ end }}
                  <div class="ed-hero-card__scrim">
                    <div class="ed-eyebrow ed-eyebrow--on-photo ed-hero-card__label">{{ .label }}</div>
                    <div class="ed-hero-card__title">{{ .subtitle }}</div>
                  </div>
                </div>
              </a>
            {{ end }}
          </div>
        </div>
        <div class="ed-hero__nav">
          <button class="ed-nav-btn" id="carousel-prev" aria-label="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
          </button>
          <button class="ed-nav-btn" id="carousel-next" aria-label="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <div class="ed-hero__meter"><div class="ed-hero__meter-fill" id="carousel-progress"></div></div>
          <span class="ed-hero__idx" id="carousel-idx">01</span>
        </div>
      </div>
    </div>

  </div>
</div>
